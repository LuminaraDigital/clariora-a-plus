name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Lint, test, validate bank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check Electron entry points
        run: npm run check

      - name: Build web distribution
        run: python tools/build_web_dist.py

      - name: Node self-tests
        run: npm test

      - name: Validate exam bank
        run: python tools/validate_bank.py --bank exam_data.json

      - name: Guard against secrets and third-party media
        run: |
          set -e
          if git ls-files | grep -Ei '\.(pfx|p12|jwk|pem|key|mp4|pptx|docx)$|(^|/)\.env$'; then
            echo "Forbidden file type is tracked."; exit 1; fi
          if git ls-files | grep -Ei 'OceanofPDF'; then
            echo "Non-redistributable content is tracked."; exit 1; fi
          echo "Tree is clean."

  linux-build:
    name: Linux packages (AppImage, deb)
    # Built on tags and manual runs only; a 100 MB build on every push is waste.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        run: npm install --no-audit --no-fund

      - name: Build AppImage and deb
        run: python3 tools/build_linux_app.py

      - name: Smoke test the unpacked build
        # Electron needs a display; xvfb provides a virtual one on the runner.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libnss3 libgtk-3-0 libxss1 libasound2t64 >/dev/null
          xvfb-run -a node tools/smoke_electron.js release/linux/linux-unpacked/comptia-a-plus-master

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/linux/CompTIA_A_Plus_Linux_*.AppImage
            release/linux/CompTIA_A_Plus_Linux_*.deb
            release/linux/latest-linux.yml
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" release/linux/CompTIA_A_Plus_Linux_*.AppImage release/linux/CompTIA_A_Plus_Linux_*.deb release/linux/latest-linux.yml --clobber

  deploy-web:
    name: Deploy web edition to Cloudflare
    # Runs on every push to main once the CLOUDFLARE_API_TOKEN repository secret
    # exists. The token needs Workers Scripts: Edit on the account.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for the deploy token
        id: token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN secret is not set; skipping deploy."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web distribution
        if: steps.token.outputs.present == 'true'
        run: python tools/build_web_dist.py

      - name: Test web distribution
        if: steps.token.outputs.present == 'true'
        run: node tools/test_web_dist.js

      - name: Deploy with wrangler
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4 deploy
