# Clariora - Cloudflare Edge Deployment
# Zone: clariora.com.au
# Account: 2373013c66331e9660e47ffa3ae40f5c

name = "clariora-a-plus"
main = "workers/api_worker.js"
compatibility_date = "2026-09-01"
account_id = "2373013c66331e9660e47ffa3ae40f5c"
workers_dev = true

routes = [
  { pattern = "clariora.com.au/*", zone_name = "clariora.com.au" },
  { pattern = "www.clariora.com.au/*", zone_name = "clariora.com.au" }
]

[assets]
directory = "./dist_web"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "clariora_edge_db"
database_id = "f1a42288-4259-4640-99dd-780845e9431f"

# R2 is not enabled on this account yet (dashboard: enable R2, then create clariora-media).
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "clariora-media"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "COACH_RATE_LIMITER"
class_name = "CoachRateLimiter"

[[migrations]]
tag = "v1-coach-rate-limiter"
new_sqlite_classes = ["CoachRateLimiter"]

[vars]
ENVIRONMENT = "production"

[build]
# Local `wrangler deploy` only. Workers Builds ignores this; see package.json postinstall.
command = "python tools/build_web_dist.py"

# Environment Variables & Secrets (Set via `wrangler secret put <KEY>`):
# - TELEGRAM_BOT_TOKEN: From @BotFather (for initData HMAC & Stars invoices)
# - TELEGRAM_WEBHOOK_SECRET: Secret token for validating incoming Telegram webhooks (X-Telegram-Bot-Api-Secret-Token)
# - EDGE_WEBHOOK_SECRET: Alias for TELEGRAM_WEBHOOK_SECRET
# - ADMIN_API_KEY: Shared secret for GET /api/v1/auth/accounts and /admin/users.html
# - FIREBASE_WEB_API_KEY: Optional override for Firebase ID token verification
# - TON_MERCHANT_WALLET_ADDRESS: Production TON merchant wallet address
# - TONCENTER_API_KEY: Mainnet TonCenter API Key for on-chain transaction verification
# - GROQ_API_KEY: Free tier fast inference (Llama 3.1 8B)
# - NVIDIA_API_KEY: Pro tier enterprise inference (Llama 3.1/3.3 70B)
# - OLLAMA_ENDPOINT: Pro tier self-hosted Ollama URL
# - OLLAMA_AUTH_TOKEN: Optional auth token for private Ollama
# - OPENROUTER_API_KEY: Pro tier multi-model inference (Claude 3.5, DeepSeek R1)
